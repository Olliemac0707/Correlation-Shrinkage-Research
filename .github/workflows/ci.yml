name: Offline research checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m ruff check src tests tools
      - run: python tools/check_publication.py
      - run: python -m covariance_research.demo --output results/ci-demo
