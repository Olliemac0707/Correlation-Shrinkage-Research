[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "covariance-portfolio-research"
version = "0.1.0"
description = "Registered correlation-shrinkage simulations and portfolio risk diagnostics"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "scikit-learn", "matplotlib", "threadpoolctl", "exchange-calendars"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
